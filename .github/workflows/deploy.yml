name: Deploy to GitHub Pages

on:
  # This repository currently has Pages configured as "Deploy from a branch".
  # The deploy job waits for GitHub's generated branch deployment, then
  # publishes the Vite artifact last so raw source cannot overwrite the app.
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Vite
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for generated branch Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status="missing"
          conclusion=""
          for attempt in {1..36}; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=dynamic&per_page=5")"
            status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$response")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$response")"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "Generated Pages deployment did not complete successfully: status=$status conclusion=$conclusion"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
